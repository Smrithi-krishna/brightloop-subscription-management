
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brightloop | Subscription Management</title>

    <link rel="stylesheet" href="./styles/main.css">

    <!-- Module stylesheets -->
    <link rel="stylesheet" href="./modules/products/products.css">
    <link rel="stylesheet" href="./modules/subscriptions/subscriptions.css">
    <link rel="stylesheet" href="./modules/billing/billing.css">
    <link rel="stylesheet" href="./modules/dashboard/dashboard.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

    <div id="auth-screen" class="auth-screen">
        <div class="auth-card">
            <div class="brand auth-brand"><div class="brand-logo">B</div><div class="brand-name">Brightloop</div></div>
            <p class="eyebrow">DEMO ACCESS</p>
            <h1>Subscription management, connected.</h1>
            <p class="auth-copy">Use the demo identities below. This localStorage authentication is for demonstration only and is not production security.</p>
            <form id="login-form">
                <label for="login-name">Name</label>
                <input id="login-name" required placeholder="Smrithi Krishna">
                <label for="login-password">Password</label>
                <input id="login-password" type="password" required placeholder="admin123">
                <button class="btn btn-primary" type="submit">Sign in</button>
                <p id="login-error" class="auth-error" role="alert"></p>
            </form>
            <form id="signup-form" class="hidden">
                <label for="signup-name">Customer name</label>
                <input id="signup-name" required placeholder="Your name">
                <label for="signup-password">Password</label>
                <input id="signup-password" type="password" minlength="4" required placeholder="At least 4 characters">
                <button class="btn btn-primary" type="submit">Create customer account</button>
                <p id="signup-error" class="auth-error" role="alert"></p>
            </form>
            <button type="button" class="auth-switch" id="signupToggle">Create a customer account</button>
            <div class="demo-identities">
                <button type="button" data-demo-login="admin">Admin demo · Smrithi Krishna</button>
                <button type="button" data-demo-login="customer">Customer demo · Letchu</button>
            </div>
        </div>
    </div>

    <div class="app-container">

        <!-- SIDEBAR -->
        <aside class="sidebar">

            <div class="brand">
                <div class="brand-logo">B</div>
                <div class="brand-name">Brightloop</div>
            </div>

            <div class="sidebar-label">WORKSPACE</div>

            <nav class="navigation">

                <button class="nav-item active" data-page="dashboard">
                    <span class="nav-icon">▦</span>
                    Dashboard
                </button>

                <button class="nav-item" data-page="products">
                    <span class="nav-icon">◈</span>
                    Products & Plans
                </button>

                <button class="nav-item" data-page="subscriptions">
                    <span class="nav-icon">⟳</span>
                    Subscriptions
                </button>

                <button class="nav-item" data-page="billing">
                    <span class="nav-icon">▤</span>
                    Billing & Payments
                </button>

            </nav>

            <div class="sidebar-bottom">
                <div class="user-avatar" id="sidebar-avatar">A</div>
                <div class="user-info">
                    <strong id="sidebar-user-name">Admin</strong>
                    <span id="sidebar-user-role">Administrator</span>
                </div>
                <button class="logout-btn" id="logoutBtn" type="button" title="Log out">↪</button>
            </div>

        </aside>


        <!-- MAIN CONTENT -->
        <main class="main-content">

            <header class="topbar">

                <div>
                    <p class="breadcrumb">Brightloop / <span id="current-page">Dashboard</span></p>
                </div>

                <div class="topbar-actions">
                    <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Open navigation">☰</button>
                    <span class="notification-icon">♧</span>
                    <div class="topbar-avatar" id="topbar-avatar">A</div>
                    <span class="admin-name" id="topbar-user-name">Admin</span>
                </div>

            </header>


            <!-- DYNAMIC PAGE CONTENT -->
            <section id="page-content" class="page-content">

                <div class="loading-message">
                    Loading Brightloop...
                </div>

            </section>

        </main>

    </div>

    <script type="module" src="./app.js"></script>

</body>
</html>
